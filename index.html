<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>لوحة رصد القصاصات الإخبارية 2026</title>
  
  <!-- Supabase JS Client -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <!-- Chart.js للرسم البياني -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

  <style>
    :root {
      --primary-color: #1b5e20;
      --secondary-color: #0288d1;
      --bg-color: #f8f9fa;
      --card-bg: #ffffff;
      --text-color: #333333;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-color);
      margin: 0;
      padding: 20px;
    }

    .container {
      max-width: 1100px;
      margin: 0 auto;
    }

    header {
      text-align: center;
      margin-bottom: 30px;
    }

    header h1 {
      color: var(--primary-color);
      margin-bottom: 5px;
    }

    /* قسم الإحصائيات والتحليل */
    .analytics-section {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
      gap: 20px;
      margin-bottom: 30px;
    }

    .stat-card {
      background: var(--card-bg);
      padding: 20px;
      border-radius: 12px;
      box-shadow: 0 4px 6px rgba(0,0,0,0.05);
      border-right: 5px solid var(--primary-color);
    }

    .stat-card.high {
      border-right-color: #d32f2f;
    }

    .stat-card h3 {
      margin: 0 0 10px 0;
      font-size: 16px;
      color: #666;
    }

    .stat-card .number {
      font-size: 28px;
      font-weight: bold;
      color: var(--text-color);
    }

    .chart-container {
      background: var(--card-bg);
      padding: 20px;
      border-radius: 12px;
      box-shadow: 0 4px 6px rgba(0,0,0,0.05);
      margin-bottom: 30px;
      max-width: 500px;
      margin-left: auto;
      margin-right: auto;
    }

    /* جدول القصاصات */
    .table-container {
      background: var(--card-bg);
      border-radius: 12px;
      padding: 20px;
      box-shadow: 0 4px 6px rgba(0,0,0,0.05);
      overflow-x: auto;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      text-align: right;
    }

    th, td {
      padding: 12px 15px;
      border-bottom: 1px solid #e0e0e0;
    }

    th {
      background-color: #f1f8e9;
      color: var(--primary-color);
    }

    .badge {
      padding: 4px 8px;
      border-radius: 4px;
      font-size: 12px;
      font-weight: bold;
    }

    .badge-high { background-color: #ffebee; color: #c62828; }
    .badge-normal { background-color: #e8f5e9; color: #2e7d32; }

    a {
      color: var(--secondary-color);
      text-decoration: none;
      font-weight: bold;
    }

    a:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>

  <div class="container">
    <header>
      <h1>📰 منصة رصد القصاصات الإخبارية (2026)</h1>
      <p>متابعة وتحليل دوري آلي لآخر الأخبار والتغطيات الصحفية</p>
    </header>

    <!-- 📊 قسم التحليلات الإحصائية -->
    <div class="analytics-section">
      <div class="stat-card">
        <h3>إجمالي القصاصات المرصودة</h3>
        <div class="number" id="total-count">0</div>
      </div>
      <div class="stat-card high">
        <h3>أخبار عالية الأهمية</h3>
        <div class="number" id="high-count">0</div>
      </div>
      <div class="stat-card">
        <h3>التصنيفات المتاحة</h3>
        <div class="number" id="cat-count">0</div>
      </div>
    </div>

    <!-- 📈 الرسم البياني -->
    <div class="chart-container">
      <canvas id="categoryChart"></canvas>
    </div>

    <!-- 📋 جدول عرض الأخبار -->
    <div class="table-container">
      <h2>قائمة أحدث القصاصات</h2>
      <table>
        <thead>
          <tr>
            <th>العنوان</th>
            <th>المصدر</th>
            <th>التصنيف</th>
            <th>الأهمية</th>
            <th>تاريخ النشر</th>
            <th>الرابط</th>
          </tr>
        </thead>
        <tbody id="clippings-table">
          <tr>
            <td colspan="6" style="text-align: center;">جاري تحميل البيانات...</td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>

  <script>
    // ==========================================
    // 1. إعداد الاتصال بـ Supabase
    // ==========================================
    // استبدل المفاتيح أدناه بمفاتيح مشروعك من Supabase
    const SUPABASE_URL = "https://sixvgxtoizjxprkpkjki.supabase.co";
    const SUPABASE_ANON_KEY = "sb_publishable_jx6mv6vokG8gydCt1Xzt5Q_1rP6xH5p";

    const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    // ==========================================
    // 2. دالة جلب البيانات وعرضها مع التحليل
    // ==========================================
    async function fetchAndAnalyzeData() {
      try {
        // جلب كافة القصاصات من الجدول
        const { data: clippings, error } = await _supabase
          .from('clippings')
          .select('*')
          .order('published_date', { ascending: false });

        if (error) throw error;

        if (!clippings || clippings.length === 0) {
          document.getElementById('clippings-table').innerHTML = `
            <tr><td colspan="6" style="text-align: center;">لا توجد قصاصات مسجلة حالياً.</td></tr>
          `;
          return;
        }

        // --- أ. معالجة الإحصائيات (Analytics Processing) ---
        const total = clippings.length;
        const highImportance = clippings.filter(item => item.importance === 'عالي').length;
        
        const categoryCounts = {};
        clippings.forEach(item => {
          const cat = item.category || 'عام';
          categoryCounts[cat] = (categoryCounts[cat] || 0) + 1;
        });

        // تحديث أرقام البطاقات
        document.getElementById('total-count').innerText = total;
        document.getElementById('high-count').innerText = highImportance;
        document.getElementById('cat-count').innerText = Object.keys(categoryCounts).length;

        // --- ب. رسم المخطط البياني (Chart.js) ---
        renderChart(categoryCounts);

        // --- ج. ملء جدول البيانات ---
        const tableBody = document.getElementById('clippings-table');
        tableBody.innerHTML = '';

        clippings.forEach(item => {
          const dateStr = item.published_date 
            ? new Date(item.published_date).toLocaleDateString('ar-DZ') 
            : 'غير محدد';

          const badgeClass = item.importance === 'عالي' ? 'badge-high' : 'badge-normal';

          const row = `
            <tr>
              <td><strong>${item.title}</strong></td>
              <td>${item.source || 'غير معروف'}</td>
              <td>${item.category || 'عام'}</td>
              <td><span class="badge ${badgeClass}">${item.importance || 'عادي'}</span></td>
              <td>${dateStr}</td>
              <td><a href="${item.link}" target="_blank" rel="noopener">عرض الخبر 🔗</a></td>
            </tr>
          `;
          tableBody.innerHTML += row;
        });

      } catch (err) {
        console.error('❌ خطأ أثناء تحميل البيانات:', err);
        document.getElementById('clippings-table').innerHTML = `
          <tr><td colspan="6" style="text-align: center; color: red;">حدث خطأ أثناء تحميل البيانات.</td></tr>
        `;
      }
    }

    // ==========================================
    // 3. دالة بناء الرسم البياني
    // ==========================================
    function renderChart(categoryCounts) {
      const ctx = document.getElementById('categoryChart').getContext('2d');
      new Chart(ctx, {
        type: 'doughnut',
        data: {
          labels: Object.keys(categoryCounts),
          datasets: [{
            data: Object.values(categoryCounts),
            backgroundColor: ['#1b5e20', '#0288d1', '#f57c00', '#7b1fa2', '#c2185b']
          }]
        },
        options: {
          responsive: true,
          plugins: {
            legend: { position: 'bottom' },
            title: {
              display: true,
              text: 'توزيع الأخبار حسب التصنيف'
            }
          }
        }
      });
    }

    // تشغيل الدالة فور تحميل الصفحة
    document.addEventListener('DOMContentLoaded', fetchAndAnalyzeData);
  </script>
</body>
</html>
