<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>القصاصات الصحفية - جمعية الشيخ أبي إسحاق</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.rtl.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body { background-color: #f8f9fa; font-family: system-ui, -apple-system, sans-serif; }
        .header-box { background: #1b4332; color: white; padding: 2rem 0; margin-bottom: 2rem; }
        .card { border: none; box-shadow: 0 4px 6px rgba(0,0,0,0.05); transition: transform 0.2s; }
        .card:hover { transform: translateY(-3px); }
        .badge-source { background-color: #2d6a4f; }
    </style>
</head>
<body>

<div class="header-box text-center">
    <h2>جمعية الشيخ أبي إسحاق لخدمة التراث</h2>
    <p class="mb-0">الرصد الصحفي والقصاصات الإخبارية اليومية</p>
</div>

<div class="container">
    <div id="loading" class="text-center my-5">
        <div class="spinner-border text-success" role="status"></div>
        <p class="mt-2">جاري تحميل أحدث القصاصات...</p>
    </div>
    
    <div id="news-container" class="row g-4"></div>
</div>

<script>
    // --- ضع بيانات Supabase العامة هنا ---
    const SUPABASE_URL = 'https://sixvgxtoizjxprkpkjki.supabase.co'; 
    const SUPABASE_ANON_KEY = 'sb_publishable_jx6mv6vokG8gydCt1Xzt5Q_1rP6xH5p';

    const db = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    async function fetchClippings() {
        const { data, error } = await db
            .from('clippings')
            .select('*')
            .order('created_at', { ascending: false });

        document.getElementById('loading').style.display = 'none';

        if (error) {
            console.error(error);
            return;
        }

        const container = document.getElementById('news-container');
        data.forEach(item => {
            const card = `
                <div class="col-md-6 col-lg-4">
                    <div class="card h-100 p-3">
                        <div class="d-flex justify-content-between align-items-center mb-2">
                            <span class="badge badge-source">${item.source || 'جريدة'}</span>
                            <small class="text-muted">${item.published_date || ''}</small>
                        </div>
                        <h5 class="card-title fs-6 fw-bold mb-3">${item.title}</h5>
                        <p class="card-text text-secondary small">${item.summary || ''}</p>
                        <a href="${item.link}" target="_blank" class="btn btn-sm btn-outline-success mt-auto">قراءة الخبر الكامل ↗</a>
                    </div>
                </div>
            `;
            container.innerHTML += card;
        });
    }

    fetchClippings();
</script>
</body>
</html>
