<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>المركز الإعلامي - قصاصات 2026</title>
    <!-- Bootstrap 5 RTL -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.rtl.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&family=Cairo:wght@600;700&display=swap" rel="stylesheet">
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Supabase JS Client -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>
        :root {
            --primary-dark: #0f2d22;
            --primary-emerald: #1b4332;
            --accent-gold: #d4af37;
            --bg-light: #f4f6f8;
            --card-shadow: 0 10px 30px rgba(0, 0, 0, 0.05);
            --hover-shadow: 0 15px 35px rgba(27, 67, 50, 0.12);
        }

        body {
            background-color: var(--bg-light);
            font-family: 'Tajawal', sans-serif;
            color: #2b2b2b;
        }

        .hero-header {
            background: linear-gradient(135deg, var(--primary-dark) 0%, var(--primary-emerald) 100%);
            color: white;
            padding: 3rem 1rem 2.5rem 1rem;
            position: relative;
            box-shadow: 0 4px 20px rgba(0,0,0,0.15);
            border-bottom: 5px solid var(--accent-gold);
        }

        .association-logo {
            max-height: 100px;
            width: auto;
            object-fit: contain;
            filter: drop-shadow(0px 4px 8px rgba(0,0,0,0.3));
        }

        .hero-title {
            font-family: 'Cairo', sans-serif;
            font-weight: 700;
        }

        .gold-badge {
            background: rgba(212, 175, 55, 0.15);
            border: 1px solid var(--accent-gold);
            color: var(--accent-gold);
            padding: 0.4rem 1.2rem;
            border-radius: 50px;
            font-size: 0.9rem;
            display: inline-block;
        }

        .filter-card {
            background: white;
            border-radius: 20px;
            box-shadow: var(--card-shadow);
            padding: 1.8rem;
        }

        .form-control, .form-select {
            border-radius: 10px;
            border: 1.5px solid #e2e8f0;
            padding: 0.6rem 1rem;
        }

        .form-control:focus, .form-select:focus {
            border-color: var(--accent-gold);
            box-shadow: 0 0 0 0.25rem rgba(212, 175, 55, 0.2);
        }

        .card-clipping {
            border: none;
            border-radius: 18px;
            background: white;
            box-shadow: var(--card-shadow);
            transition: all 0.3s ease;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .card-clipping:hover {
            transform: translateY(-6px);
            box-shadow: var(--hover-shadow);
        }

        .card-tag-category {
            background-color: rgba(27, 67, 50, 0.08);
            color: var(--primary-emerald);
            font-weight: 700;
            font-size: 0.8rem;
            padding: 0.35rem 0.8rem;
            border-radius: 8px;
        }

        .card-tag-importance-عالي {
            background-color: rgba(220, 53, 69, 0.1);
            color: #dc3545;
            font-weight: 700;
            font-size: 0.8rem;
            padding: 0.35rem 0.8rem;
            border-radius: 8px;
        }

        .card-tag-importance-عادي {
            background-color: rgba(108, 117, 125, 0.1);
            color: #6c757d;
            font-weight: 700;
            font-size: 0.8rem;
            padding: 0.35rem 0.8rem;
            border-radius: 8px;
        }

        .btn-read-more {
            background-color: var(--primary-emerald);
            color: white;
            border-radius: 10px;
            font-weight: 700;
            padding: 0.6rem;
            transition: all 0.2s ease;
        }

        .btn-read-more:hover {
            background-color: var(--accent-gold);
            color: var(--primary-dark);
        }

        .counter-badge {
            background: var(--primary-dark);
            color: var(--accent-gold);
            font-weight: bold;
            padding: 0.4rem 1rem;
            border-radius: 50px;
        }
    </style>
</head>
<body>

    <header class="hero-header text-center">
        <div class="container">
            <div class="mb-3">
                <img src="logo.png" alt="شعار جمعية الشيخ أبي إسحاق" class="association-logo" onerror="this.style.display='none'">
            </div>
            <span class="gold-badge mb-3"><i class="fa-solid fa-archway me-1"></i> وحدة الرصد والإعلام الرقمي</span>
            <h1 class="hero-title display-6 mb-2">أرشيف القصاصات الصحفية (سنة 2026 فقط)</h1>
            <p class="lead opacity-75 mb-0 fs-6">جمعية الشيخ أبي إسحاق إبراهيم أطفيش لخدمة التراث - غرداية</p>
        </div>
    </header>

    <div class="container my-4">
        
        <!-- بطاقة الفرز والتصفية خاص بـ 2026 -->
        <div class="filter-card mb-4">
            <div class="row g-3 mb-2">
                <div class="col-md-4">
                    <label class="form-label fw-bold text-secondary small"><i class="fa-solid fa-magnifying-glass me-1"></i> بحث بالنص</label>
                    <input type="text" id="filter-search" class="form-control" placeholder="بحث في العنوان أو الملخص..." oninput="applyFilters()">
                </div>
                <div class="col-md-2">
                    <label class="form-label fw-bold text-secondary small"><i class="fa-solid fa-shapes me-1"></i> الموضوع</label>
                    <select id="filter-category" class="form-select" onchange="applyFilters()">
                        <option value="">كل الموضوعات</option>
                    </select>
                </div>
                <div class="col-md-2">
                    <label class="form-label fw-bold text-secondary small"><i class="fa-solid fa-layer-group me-1"></i> الأهمية</label>
                    <select id="filter-importance" class="form-select" onchange="applyFilters()">
                        <option value="">الكل</option>
                        <option value="عالي">عالي</option>
                        <option value="عادي">عادي</option>
                    </select>
                </div>
                <div class="col-md-4">
                    <label class="form-label fw-bold text-secondary small"><i class="fa-solid fa-newspaper me-1"></i> المصدر / الصحيفة</label>
                    <select id="filter-source" class="form-select" onchange="applyFilters()">
                        <option value="">كافة المصادر</option>
                    </select>
                </div>
            </div>

            <div class="row g-3 border-top pt-2 mt-2">
                <div class="col-md-3">
                    <label class="form-label fw-bold text-secondary small"><i class="fa-regular fa-calendar-minus me-1"></i> تاريخ الصدور في 2026 (من)</label>
                    <input type="date" id="filter-date-from" class="form-control" min="2026-01-01" max="2026-12-31" onchange="applyFilters()">
                </div>
                <div class="col-md-3">
                    <label class="form-label fw-bold text-secondary small"><i class="fa-regular fa-calendar-plus me-1"></i> تاريخ الصدور في 2026 (إلى)</label>
                    <input type="date" id="filter-date-to" class="form-control" min="2026-01-01" max="2026-12-31" onchange="applyFilters()">
                </div>
                <div class="col-md-4">
                    <label class="form-label fw-bold text-secondary small"><i class="fa-solid fa-arrow-down-short-wide me-1"></i> طريقة الترتيب</label>
                    <select id="filter-sort" class="form-select" onchange="applyFilters()">
                        <option value="newest_published">حسب التاريخ (الأحدث في 2026 أولاً)</option>
                        <option value="oldest_published">حسب التاريخ (الأقدم في 2026 أولاً)</option>
                        <option value="importance">حسب الأهمية</option>
                        <option value="source">أبجدياً حسب المصدر</option>
                        <option value="title">أبجدياً حسب العنوان</option>
                    </select>
                </div>
                <div class="col-md-2 d-flex align-items-end">
                    <button class="btn btn-outline-secondary w-100" onclick="resetFilters()">
                        <i class="fa-solid fa-rotate me-1"></i> إعادة ضبط
                    </button>
                </div>
            </div>
        </div>

        <div class="d-flex justify-content-between align-items-center mb-4">
            <h4 class="fw-bold text-dark mb-0"><i class="fa-solid fa-newspaper text-success me-2"></i> قصاصات سنة 2026</h4>
            <span id="clippings-count" class="counter-badge">0 قصاصة</span>
        </div>

        <div id="clippings-grid" class="row g-4"></div>

    </div>

    <!-- JS Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    
    <script>
        const SUPABASE_URL = "https://sixvgxtoizjxprkpkjki.supabase.co"; 
        const SUPABASE_KEY = "sb_publishable_jx6mv6vokG8gydCt1Xzt5Q_1rP6xH5p"; 
        const DATE_FIELD = "published_date"; 

        let supabaseClient;
        let data2026Only = [];

        try {
            supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
        } catch (e) {
            console.error("خطأ في إعداد Supabase:", e);
        }

        document.addEventListener("DOMContentLoaded", () => {
            loadOnly2026Clippings();
        });

        // 🎯 دالة الاستعلام التي تجلب وتصفّي قصاصات سنة 2026 فقط من قاعدة البيانات مباشرة
        async function loadOnly2026Clippings() {
            const container = document.getElementById("clippings-grid");
            container.innerHTML = '<div class="text-center py-5"><div class="spinner-border text-success" role="status"></div><p class="mt-2 text-muted">جاري تحميل قصاصات سنة 2026 فقط...</p></div>';

            if (!SUPABASE_URL.includes("supabase.co") || SUPABASE_KEY.includes("YOUR_SUPABASE")) {
                container.innerHTML = `<div class="col-12 text-center text-danger py-4">⚠️ يرجى ضبط مفاتيح SUPABASE_URL و SUPABASE_KEY أولاً.</div>`;
                return;
            }

            let all2026Rows = [];
            let page = 0;
            const pageSize = 1000;
            let hasMore = true;

            // جلب البيانات مع تطبيق تصفية السنة 2026 في السيرفر مباشر لسرعة الأداء
            while (hasMore) {
                const { data, error } = await supabaseClient
                    .from('clippings')
                    .select('*')
                    .gte(DATE_FIELD, '2026-01-01T00:00:00.000Z')
                    .lte(DATE_FIELD, '2026-12-31T23:59:59.999Z')
                    .range(page * pageSize, (page + 1) * pageSize - 1)
                    .order(DATE_FIELD, { ascending: false });

                if (error) {
                    console.error("خطأ جلب البيانات:", error);
                    container.innerHTML = `<div class="col-12 text-center text-danger py-4">تعذر جلب البيانات: ${error.message}</div>`;
                    return;
                }

                if (data && data.length > 0) {
                    all2026Rows = all2026Rows.concat(data);
                    if (data.length < pageSize) {
                        hasMore = false;
                    } else {
                        page++;
                    }
                } else {
                    hasMore = false;
                }
            }

            data2026Only = all2026Rows;
            populateDropdownFilters(data2026Only);
            applyFilters();
        }

        function populateDropdownFilters(data) {
            const sourceSelect = document.getElementById("filter-source");
            const categorySelect = document.getElementById("filter-category");

            const sources = [...new Set(data.map(item => item.source))].filter(Boolean);
            const categories = [...new Set(data.map(item => item.category))].filter(Boolean);

            sourceSelect.innerHTML = '<option value="">كافة المصادر</option>';
            sources.forEach(src => {
                sourceSelect.innerHTML += `<option value="${src}">${src}</option>`;
            });

            categorySelect.innerHTML = '<option value="">كل الموضوعات</option>';
            categories.forEach(cat => {
                categorySelect.innerHTML += `<option value="${cat}">${cat}</option>`;
            });
        }

        // التصفية والفرز لـ 2026
        function applyFilters() {
            let filtered = [...data2026Only];

            const searchValue = document.getElementById("filter-search").value.toLowerCase().trim();
            const categoryValue = document.getElementById("filter-category").value;
            const importanceValue = document.getElementById("filter-importance").value;
            const sourceValue = document.getElementById("filter-source").value;
            const dateFromValue = document.getElementById("filter-date-from").value;
            const dateToValue = document.getElementById("filter-date-to").value;
            const sortValue = document.getElementById("filter-sort").value;

            if (searchValue) {
                filtered = filtered.filter(item => 
                    (item.title && item.title.toLowerCase().includes(searchValue)) ||
                    (item.summary && item.summary.toLowerCase().includes(searchValue))
                );
            }

            if (categoryValue) filtered = filtered.filter(item => item.category === categoryValue);
            if (importanceValue) filtered = filtered.filter(item => item.importance === importanceValue);
            if (sourceValue) filtered = filtered.filter(item => item.source === sourceValue);

            if (dateFromValue) {
                filtered = filtered.filter(item => {
                    if (!item[DATE_FIELD]) return false;
                    const pubDate = new Date(item[DATE_FIELD]).toISOString().split('T')[0];
                    return pubDate >= dateFromValue;
                });
            }

            if (dateToValue) {
                filtered = filtered.filter(item => {
                    if (!item[DATE_FIELD]) return false;
                    const pubDate = new Date(item[DATE_FIELD]).toISOString().split('T')[0];
                    return pubDate <= dateToValue;
                });
            }

            if (sortValue === "newest_published") {
                filtered.sort((a, b) => new Date(b[DATE_FIELD] || 0) - new Date(a[DATE_FIELD] || 0));
            } else if (sortValue === "oldest_published") {
                filtered.sort((a, b) => new Date(a[DATE_FIELD] || 0) - new Date(b[DATE_FIELD] || 0));
            } else if (sortValue === "importance") {
                filtered.sort((a, b) => (b.importance === "عالي" ? 1 : -1));
            } else if (sortValue === "source") {
                filtered.sort((a, b) => (a.source || '').localeCompare(b.source || '', 'ar'));
            } else if (sortValue === "title") {
                filtered.sort((a, b) => (a.title || '').localeCompare(b.title || '', 'ar'));
            }

            document.getElementById("clippings-count").innerText = `${filtered.length} قصاصة (سنة 2026)`;
            renderGrid(filtered, "clippings-grid");
        }

        function resetFilters() {
            document.getElementById("filter-search").value = "";
            document.getElementById("filter-category").value = "";
            document.getElementById("filter-importance").value = "";
            document.getElementById("filter-source").value = "";
            document.getElementById("filter-date-from").value = "";
            document.getElementById("filter-date-to").value = "";
            document.getElementById("filter-sort").value = "newest_published";
            applyFilters();
        }

        // عرض القصاصات
        function renderGrid(items, targetContainerId) {
            const container = document.getElementById(targetContainerId);
            
            if (items.length === 0) {
                container.innerHTML = `
                    <div class="col-12 text-center py-5">
                        <div class="p-5 bg-white rounded-4 shadow-sm text-muted">
                            <i class="fa-regular fa-calendar-xmark fa-3x mb-3 text-warning"></i>
                            <h5 class="fw-bold">لم نجد أية قصاصات صادرة خلال عام 2026 تطابق بحثك.</h5>
                        </div>
                    </div>`;
                return;
            }

            container.innerHTML = items.map(item => {
                const issueDate = item[DATE_FIELD] ? new Date(item[DATE_FIELD]).toLocaleDateString('ar-DZ') : 'غير محدد';

                return `
                <div class="col-md-6 col-lg-4">
                    <div class="card card-clipping p-4">
                        <div>
                            <div class="d-flex justify-content-between align-items-center mb-3">
                                <span class="card-tag-category"><i class="fa-solid fa-tag me-1"></i> ${item.category || 'أخبار عامة'}</span>
                                <span class="card-tag-importance-${item.importance || 'عادي'}">أهمية: ${item.importance || 'عادي'}</span>
                            </div>
                            <h5 class="fw-bold text-dark mb-3" style="font-size: 1.15rem; line-height: 1.6;">${item.title}</h5>
                            <p class="text-muted small mb-4 opacity-75" style="line-height: 1.6;">${item.summary ? item.summary.substring(0, 120) + '...' : 'لا يوجد ملخص متاح.'}</p>
                        </div>
                        <div>
                            <hr class="my-3 opacity-10">
                            <div class="d-flex justify-content-between align-items-center small text-secondary mb-3">
                                <span class="fw-bold"><i class="fa-regular fa-newspaper me-1 text-success"></i> ${item.source}</span>
                                <span><i class="fa-regular fa-calendar me-1"></i> الصدور: ${issueDate}</span>
                            </div>
                            <a href="${item.link}" target="_blank" class="btn btn-read-more w-100 text-decoration-none text-center">
                                قراءة الخبر من المصدر <i class="fa-solid fa-arrow-up-right-from-square ms-1"></i>
                            </a>
                        </div>
                    </div>
                </div>
            `}).join('');
        }
    </script>
</body>
</html>
