<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>المركز الإعلامي - جمعية الشيخ أبي إسحاق للتراث</title>
    <!-- Bootstrap 5 RTL -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.rtl.min.css">
    <!-- Google Fonts: Tajawal & Cairo -->
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&family=Cairo:wght@600;700&display=swap" rel="stylesheet">
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Supabase JS Client -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>
        :root {
            --primary-dark: #0f2d22;
            --primary-emerald: #1b4332;
            --accent-gold: #d4af37;
            --bg-light: #f4f6f8;
            --card-shadow: 0 10px 30px rgba(0, 0, 0, 0.05);
            --hover-shadow: 0 15px 35px rgba(27, 67, 50, 0.12);
        }

        body {
            background-color: var(--bg-light);
            font-family: 'Tajawal', sans-serif;
            color: #2b2b2b;
        }

        .hero-header {
            background: linear-gradient(135deg, var(--primary-dark) 0%, var(--primary-emerald) 100%);
            color: white;
            padding: 3rem 1rem 2.5rem 1rem;
            position: relative;
            box-shadow: 0 4px 20px rgba(0,0,0,0.15);
            border-bottom: 5px solid var(--accent-gold);
        }

        .association-logo {
            max-height: 100px;
            width: auto;
            object-fit: contain;
            filter: drop-shadow(0px 4px 8px rgba(0,0,0,0.3));
        }

        .hero-title {
            font-family: 'Cairo', sans-serif;
            font-weight: 700;
        }

        .gold-badge {
            background: rgba(212, 175, 55, 0.15);
            border: 1px solid var(--accent-gold);
            color: var(--accent-gold);
            padding: 0.4rem 1.2rem;
            border-radius: 50px;
            font-size: 0.9rem;
            display: inline-block;
        }

        .custom-nav-pills {
            background: white;
            padding: 8px;
            border-radius: 16px;
            box-shadow: var(--card-shadow);
        }

        .custom-nav-pills .nav-link {
            color: var(--primary-emerald);
            font-weight: 700;
            border-radius: 12px;
            padding: 1rem 1.5rem;
            transition: all 0.3s ease;
        }

        .custom-nav-pills .nav-link.active {
            background: linear-gradient(135deg, var(--primary-emerald) 0%, var(--primary-dark) 100%);
            color: white;
            box-shadow: 0 4px 15px rgba(27, 67, 50, 0.3);
        }

        .filter-card {
            background: white;
            border-radius: 20px;
            box-shadow: var(--card-shadow);
            padding: 1.8rem;
        }

        .form-control, .form-select {
            border-radius: 10px;
            border: 1.5px solid #e2e8f0;
            padding: 0.6rem 1rem;
        }

        .form-control:focus, .form-select:focus {
            border-color: var(--accent-gold);
            box-shadow: 0 0 0 0.25rem rgba(212, 175, 55, 0.2);
        }

        .card-clipping {
            border: none;
            border-radius: 18px;
            background: white;
            box-shadow: var(--card-shadow);
            transition: all 0.3s ease;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .card-clipping:hover {
            transform: translateY(-6px);
            box-shadow: var(--hover-shadow);
        }

        .card-tag-category {
            background-color: rgba(27, 67, 50, 0.08);
            color: var(--primary-emerald);
            font-weight: 700;
            font-size: 0.8rem;
            padding: 0.35rem 0.8rem;
            border-radius: 8px;
        }

        .card-tag-importance-عالي {
            background-color: rgba(220, 53, 69, 0.1);
            color: #dc3545;
            font-weight: 700;
            font-size: 0.8rem;
            padding: 0.35rem 0.8rem;
            border-radius: 8px;
        }

        .card-tag-importance-عادي {
            background-color: rgba(108, 117, 125, 0.1);
            color: #6c757d;
            font-weight: 700;
            font-size: 0.8rem;
            padding: 0.35rem 0.8rem;
            border-radius: 8px;
        }

        .btn-read-more {
            background-color: var(--primary-emerald);
            color: white;
            border-radius: 10px;
            font-weight: 700;
            padding: 0.6rem;
            transition: all 0.2s ease;
        }

        .btn-read-more:hover {
            background-color: var(--accent-gold);
            color: var(--primary-dark);
        }

        .counter-badge {
            background: var(--primary-dark);
            color: var(--accent-gold);
            font-weight: bold;
            padding: 0.4rem 1rem;
            border-radius: 50px;
        }
    </style>
</head>
<body>

    <!-- الهيدر مع الشعار -->
    <header class="hero-header text-center">
        <div class="container">
            <div class="mb-3">
                <img src="logo.png" alt="شعار جمعية الشيخ أبي إسحاق" class="association-logo" onerror="this.style.display='none'">
            </div>
            <span class="gold-badge mb-3"><i class="fa-solid fa-archway me-1"></i> وحدة الرصد والإعلام الرقمي</span>
            <h1 class="hero-title display-6 mb-2">أرشيف القصاصات الصحفية والإعلامية</h1>
            <p class="lead opacity-75 mb-0 fs-6">جمعية الشيخ أبي إسحاق إبراهيم أطفيش لخدمة التراث - غرداية</p>
        </div>
    </header>

    <div class="container my-4">
        
        <!-- التبويبات -->
        <ul class="nav nav-pills custom-nav-pills nav-justified mb-4" id="mainTabs" role="tablist">
            <li class="nav-item" role="presentation">
                <button class="nav-link active fs-5" id="today-tab" data-bs-toggle="tab" data-bs-target="#today-content" type="button" onclick="loadTodayClippings()">
                    <i class="fa-solid fa-calendar-day me-2 text-warning"></i> القصاصات الصادرة اليوم
                </button>
            </li>
            <li class="nav-item" role="presentation">
                <button class="nav-link fs-5" id="archive-tab" data-bs-toggle="tab" data-bs-target="#archive-content" type="button" onclick="loadArchiveClippings()">
                    <i class="fa-solid fa-boxes-stacked me-2"></i> الأرشيف الكامل والفرز
                </button>
            </li>
        </ul>

        <div class="tab-content" id="mainTabsContent">
            
            <!-- 1. قسم قصاصات اليوم الصادرة -->
            <div class="tab-pane fade show active" id="today-content" role="tabpanel">
                <div class="d-flex justify-content-between align-items-center mb-4">
                    <h4 class="fw-bold text-dark mb-0"><i class="fa-regular fa-clock text-success me-2"></i> القصاصات الصادرة اليوم حصراً</h4>
                    <span id="today-count" class="counter-badge">0 قصاصة</span>
                </div>
                <div id="today-grid" class="row g-4"></div>
            </div>

            <!-- 2. قسم الأرشيف الكامل والتصفية بالصدور -->
            <div class="tab-pane fade" id="archive-content" role="tabpanel">
                
                <div class="filter-card mb-4">
                    <!-- السطر الأول من الفرز -->
                    <div class="row g-3 mb-2">
                        <div class="col-md-4">
                            <label class="form-label fw-bold text-secondary small"><i class="fa-solid fa-magnifying-glass me-1"></i> بحث بالنص</label>
                            <input type="text" id="filter-search" class="form-control" placeholder="بحث بالفي العنوان أو الملخص..." oninput="applyArchiveFilters()">
                        </div>
                        <div class="col-md-2">
                            <label class="form-label fw-bold text-secondary small"><i class="fa-solid fa-shapes me-1"></i> الموضوع</label>
                            <select id="filter-category" class="form-select" onchange="applyArchiveFilters()">
                                <option value="">كل الموضوعات</option>
                            </select>
                        </div>
                        <div class="col-md-2">
                            <label class="form-label fw-bold text-secondary small"><i class="fa-solid fa-layer-group me-1"></i> الأهمية</label>
                            <select id="filter-importance" class="form-select" onchange="applyArchiveFilters()">
                                <option value="">الكل</option>
                                <option value="عالي">عالي</option>
                                <option value="عادي">عادي</option>
                            </select>
                        </div>
                        <div class="col-md-4">
                            <label class="form-label fw-bold text-secondary small"><i class="fa-solid fa-newspaper me-1"></i> المصدر / الصحيفة</label>
                            <select id="filter-source" class="form-select" onchange="applyArchiveFilters()">
                                <option value="">كافة المصادر</option>
                            </select>
                        </div>
                    </div>

                    <!-- السطر الثاني: الفرز حسب تاريخ الصدور والترتيب -->
                    <div class="row g-3 border-top pt-2 mt-2">
                        <div class="col-md-3">
                            <label class="form-label fw-bold text-secondary small"><i class="fa-regular fa-calendar-minus me-1"></i> تاريخ الصدور (من)</label>
                            <input type="date" id="filter-date-from" class="form-control" onchange="applyArchiveFilters()">
                        </div>
                        <div class="col-md-3">
                            <label class="form-label fw-bold text-secondary small"><i class="fa-regular fa-calendar-plus me-1"></i> تاريخ الصدور (إلى)</label>
                            <input type="date" id="filter-date-to" class="form-control" onchange="applyArchiveFilters()">
                        </div>
                        <div class="col-md-4">
                            <label class="form-label fw-bold text-secondary small"><i class="fa-solid fa-arrow-down-short-wide me-1"></i> طريقة الترتيب</label>
                            <select id="filter-sort" class="form-select" onchange="applyArchiveFilters()">
                                <option value="newest_published">حسب تاريخ الصدور (الأحدث أولاً)</option>
                                <option value="oldest_published">حسب تاريخ الصدور (الأقدَم أولاً)</option>
                                <option value="importance">حسب الأهمية</option>
                                <option value="source">أبجدياً حسب المصدر</option>
                                <option value="title">أبجدياً حسب العنوان</option>
                            </select>
                        </div>
                        <div class="col-md-2 d-flex align-items-end">
                            <button class="btn btn-outline-secondary w-100" onclick="resetArchiveFilters()">
                                <i class="fa-solid fa-rotate me-1"></i> إعادة ضبط
                            </button>
                        </div>
                    </div>
                </div>

                <div class="d-flex justify-content-between align-items-center mb-4">
                    <h4 class="fw-bold text-dark mb-0"><i class="fa-solid fa-vault text-success me-2"></i> جميع القصاصات الأرشيفية</h4>
                    <span id="archive-count" class="counter-badge">0 قصاصة</span>
                </div>

                <div id="archive-grid" class="row g-4"></div>
            </div>

        </div>
    </div>

    <!-- JS Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    
    <script>
        const SUPABASE_URL = "https://sixvgxtoizjxprkpkjki.supabase.co"; 
        const SUPABASE_KEY = "sb_publishable_jx6mv6vokG8gydCt1Xzt5Q_1rP6xH5p"; 

        // 🟢 اسم عمود تاريخ الصدور في جدول Supabase (تأكد من مطابقته لجدولك، مثلاً: published_at أو issue_date)
        const DATE_FIELD = "published_at"; 

        let supabaseClient;
        let allArchiveData = [];

        try {
            supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
        } catch (e) {
            console.error("خطأ في إعداد Supabase:", e);
        }

        document.addEventListener("DOMContentLoaded", () => {
            loadTodayClippings();
        });

        // 1. جلب القصاصات التي صُدرت بتاريخ اليوم حصراً
        async function loadTodayClippings() {
            const todayContainer = document.getElementById("today-grid");
            todayContainer.innerHTML = '<div class="text-center py-5"><div class="spinner-border text-success" role="status"></div></div>';

            if (!SUPABASE_URL.includes("supabase.co") || SUPABASE_KEY.includes("YOUR_SUPABASE")) {
                todayContainer.innerHTML = `<div class="col-12 text-center text-danger py-4">⚠️ يرجى ضبط مفاتيح SUPABASE_URL و SUPABASE_KEY أولاً.</div>`;
                return;
            }

            const now = new Date();
            const year = now.getFullYear();
            const month = String(now.getMonth() + 1).padStart(2, '0');
            const day = String(now.getDate()).padStart(2, '0');
            const todayStr = `${year}-${month}-${day}`;

            const { data, error } = await supabaseClient
                .from('clippings')
                .select('*')
                .gte(DATE_FIELD, `${todayStr}T00:00:00.000Z`)
                .lte(DATE_FIELD, `${todayStr}T23:59:59.999Z`)
                .order(DATE_FIELD, { ascending: false });

            if (error) {
                todayContainer.innerHTML = `<div class="col-12 text-center text-danger py-4">تعذر جلب البيانات: ${error.message}</div>`;
                return;
            }

            if (!data || data.length === 0) {
                todayContainer.innerHTML = `
                    <div class="col-12 text-center py-5">
                        <div class="p-5 bg-white rounded-4 shadow-sm">
                            <i class="fa-regular fa-calendar-xmark fa-4x text-warning mb-3"></i>
                            <h5 class="fw-bold text-dark">لا توجد قصاصات جديدة صُدرت بتاريخ اليوم (${todayStr})</h5>
                            <p class="text-muted small mb-0">يرجى الانتقال لتبويب الأرشيف لاستعراض القصاصات السابقة والفرز حسب التاريخ.</p>
                        </div>
                    </div>`;
                document.getElementById("today-count").innerText = "0 قصاصة";
                return;
            }

            document.getElementById("today-count").innerText = `${data.length} قصاصة`;
            renderGrid(data, "today-grid");
        }

        // 2. جلب كافة القصاصات مرتبة بحسب تاريخ الصدور
        async function loadArchiveClippings() {
            const archiveContainer = document.getElementById("archive-grid");
            archiveContainer.innerHTML = '<div class="text-center py-5"><div class="spinner-border text-success" role="status"></div></div>';

            if (!SUPABASE_URL.includes("supabase.co") || SUPABASE_KEY.includes("YOUR_SUPABASE")) {
                archiveContainer.innerHTML = `<div class="col-12 text-center text-danger py-4">⚠️ يرجى ضبط مفاتيح SUPABASE_URL و SUPABASE_KEY أولاً.</div>`;
                return;
            }

            const { data, error } = await supabaseClient
                .from('clippings')
                .select('*')
                .order(DATE_FIELD, { ascending: false });

            if (error) {
                archiveContainer.innerHTML = `<div class="col-12 text-center text-danger py-5">خطأ في جلب البيانات: ${error.message}</div>`;
                return;
            }

            allArchiveData = data;
            populateDropdownFilters(data);
            applyArchiveFilters();
        }

        function populateDropdownFilters(data) {
            const sourceSelect = document.getElementById("filter-source");
            const categorySelect = document.getElementById("filter-category");

            const sources = [...new Set(data.map(item => item.source))].filter(Boolean);
            const categories = [...new Set(data.map(item => item.category))].filter(Boolean);

            sourceSelect.innerHTML = '<option value="">كافة المصادر</option>';
            sources.forEach(src => {
                sourceSelect.innerHTML += `<option value="${src}">${src}</option>`;
            });

            categorySelect.innerHTML = '<option value="">كل الموضوعات</option>';
            categories.forEach(cat => {
                categorySelect.innerHTML += `<option value="${cat}">${cat}</option>`;
            });
        }

        // 3. تصفية وفرز البيانات بناءً على تاريخ الصدور والمعايير الأخرى
        function applyArchiveFilters() {
            let filtered = [...allArchiveData];

            const searchValue = document.getElementById("filter-search").value.toLowerCase().trim();
            const categoryValue = document.getElementById("filter-category").value;
            const importanceValue = document.getElementById("filter-importance").value;
            const sourceValue = document.getElementById("filter-source").value;
            const dateFromValue = document.getElementById("filter-date-from").value;
            const dateToValue = document.getElementById("filter-date-to").value;
            const sortValue = document.getElementById("filter-sort").value;

            // فلترة بالنص
            if (searchValue) {
                filtered = filtered.filter(item => 
                    (item.title && item.title.toLowerCase().includes(searchValue)) ||
                    (item.summary && item.summary.toLowerCase().includes(searchValue))
                );
            }

            // فلترة بالتصنيف والأهمية والمصدر
            if (categoryValue) filtered = filtered.filter(item => item.category === categoryValue);
            if (importanceValue) filtered = filtered.filter(item => item.importance === importanceValue);
            if (sourceValue) filtered = filtered.filter(item => item.source === sourceValue);

            // فلترة حسب تاريخ الصدور (من - إلى)
            if (dateFromValue) {
                filtered = filtered.filter(item => {
                    const pubDate = new Date(item[DATE_FIELD]).toISOString().split('T')[0];
                    return pubDate >= dateFromValue;
                });
            }

            if (dateToValue) {
                filtered = filtered.filter(item => {
                    const pubDate = new Date(item[DATE_FIELD]).toISOString().split('T')[0];
                    return pubDate <= dateToValue;
                });
            }

            // الترتيب بحسب تاريخ الصدور أو الخيارات الأخرى
            if (sortValue === "newest_published") {
                filtered.sort((a, b) => new Date(b[DATE_FIELD]) - new Date(a[DATE_FIELD]));
            } else if (sortValue === "oldest_published") {
                filtered.sort((a, b) => new Date(a[DATE_FIELD]) - new Date(b[DATE_FIELD]));
            } else if (sortValue === "importance") {
                filtered.sort((a, b) => (b.importance === "عالي" ? 1 : -1));
            } else if (sortValue === "source") {
                filtered.sort((a, b) => (a.source || '').localeCompare(b.source || '', 'ar'));
            } else if (sortValue === "title") {
                filtered.sort((a, b) => (a.title || '').localeCompare(b.title || '', 'ar'));
            }

            document.getElementById("archive-count").innerText = `${filtered.length} قصاصة`;
            renderGrid(filtered, "archive-grid");
        }

        // إعادة ضبط الفلترة
        function resetArchiveFilters() {
            document.getElementById("filter-search").value = "";
            document.getElementById("filter-category").value = "";
            document.getElementById("filter-importance").value = "";
            document.getElementById("filter-source").value = "";
            document.getElementById("filter-date-from").value = "";
            document.getElementById("filter-date-to").value = "";
            document.getElementById("filter-sort").value = "newest_published";
            applyArchiveFilters();
        }

        // 4. عرض البطاقات مع إبراز تاريخ الصدور
        function renderGrid(items, targetContainerId) {
            const container = document.getElementById(targetContainerId);
            
            if (items.length === 0) {
                container.innerHTML = `
                    <div class="col-12 text-center py-5">
                        <div class="p-5 bg-white rounded-4 shadow-sm text-muted">
                            <i class="fa-solid fa-filter-circle-xmark fa-3x mb-3"></i>
                            <h5 class="fw-bold">لم نجد أية نتائج تطابق معايير التاريخ أو الفرز المحددة.</h5>
                        </div>
                    </div>`;
                return;
            }

            container.innerHTML = items.map(item => {
                const issueDate = item[DATE_FIELD] ? new Date(item[DATE_FIELD]).toLocaleDateString('ar-DZ') : 'غير محدد';

                return `
                <div class="col-md-6 col-lg-4">
                    <div class="card card-clipping p-4">
                        <div>
                            <div class="d-flex justify-content-between align-items-center mb-3">
                                <span class="card-tag-category"><i class="fa-solid fa-tag me-1"></i> ${item.category || 'أخبار عامة'}</span>
                                <span class="card-tag-importance-${item.importance || 'عادي'}">أهمية: ${item.importance || 'عادي'}</span>
                            </div>
                            <h5 class="fw-bold text-dark mb-3" style="font-size: 1.15rem; line-height: 1.6;">${item.title}</h5>
                            <p class="text-muted small mb-4 opacity-75" style="line-height: 1.6;">${item.summary ? item.summary.substring(0, 120) + '...' : 'لا يوجد ملخص متاح.'}</p>
                        </div>
                        <div>
                            <hr class="my-3 opacity-10">
                            <div class="d-flex justify-content-between align-items-center small text-secondary mb-3">
                                <span class="fw-bold"><i class="fa-regular fa-newspaper me-1 text-success"></i> ${item.source}</span>
                                <span><i class="fa-regular fa-calendar me-1"></i> الصدور: ${issueDate}</span>
                            </div>
                            <a href="${item.link}" target="_blank" class="btn btn-read-more w-100 text-decoration-none text-center">
                                قراءة الخبر من المصدر <i class="fa-solid fa-arrow-up-right-from-square ms-1"></i>
                            </a>
                        </div>
                    </div>
                </div>
            `}).join('');
        }
    </script>
</body>
</html>
