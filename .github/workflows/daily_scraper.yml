import os
import sys
import time
import requests
from bs4 import BeautifulSoup
from datetime import datetime, timedelta
from supabase import create_client, Client

# ==========================================
# 1. إعدادات الاتصال والبيئة لعام 2026
# ==========================================
SUPABASE_URL = os.getenv("SUPABASE_URL")
SUPABASE_KEY = os.getenv("SUPABASE_KEY")

if not SUPABASE_URL or not SUPABASE_KEY:
    print("❌ خطأ: لم يتم ضبط متغيرات البيئة SUPABASE_URL و SUPABASE_KEY")
    sys.exit(1)

supabase: Client = create_client(SUPABASE_URL, SUPABASE_KEY)
TABLE_NAME = "clippings"

YEAR_START = datetime(2026, 1, 1)
YEAR_END = datetime(2026, 12, 31, 23, 59, 59)

# ==========================================
# 2. جلب جميع القصاصات المسجلة لمنع التكرار (Pagination)
# ==========================================
def get_existing_links():
    """جلب كل الروابط المسجلة لسنة 2026 بدون تقييد الـ 100"""
    existing_links = set()
    start = 0
    page_size = 1000

    while True:
        res = supabase.table(TABLE_NAME) \
            .select('link') \
            .gte('published_date', YEAR_START.isoformat()) \
            .lte('published_date', YEAR_END.isoformat()) \
            .range(start, start + page_size - 1) \
            .execute()
        
        data = res.data
        if not data:
            break
            
        for row in data:
            if row.get('link'):
                existing_links.add(row['link'])
                
        if len(data) < page_size:
            break
        start += page_size

    print(f"📦 عدد القصاصات المسجلة حالياً في قاعدة البيانات لسنة 2026: {len(existing_links)}")
    return existing_links

# ==========================================
# 3. محرك السحب العميق مع دعم التنقل بين الصفحات (Scraper with Pagination)
# ==========================================
def scrape_all_2026_news():
    """يسحب الأخبار وينتقل عبر الصفحات حتى يستخرج كل مقالات 2026"""
    all_scraped_items = []
    
    # ⚠️ قم بتعديل هذا الرابط والوسوم لتناسب الموقع الإخباري المستهدف
    base_url = "https://example-news-site.com/search?q=غرداية" 
    
    headers = {
        'User-Agent': 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36'
    }

    page = 1
    max_pages = 50  # السماح بالتنقل حتى 50 صفحة لتجاوز عقبة الـ 100 عنصر
    stop_scraping = False

    print("🔍 بدء السحب العميق والتنقل عبر الصفحات لعام 2026...")

    while page <= max_pages and not stop_scraping:
        page_url = f"{base_url}&page={page}"
        print(f"  📄 سحب الصفحة رقم: {page} -> {page_url}")

        try:
            response = requests.get(page_url, headers=headers, timeout=15)
            if response.status_code != 200:
                print(f"⚠️ توقف السحب عند الصفحة {page} بسبب الاستجابة {response.status_code}")
                break

            soup = BeautifulSoup(response.text, 'html.parser')
            
            # ⚠️ حدد وسم مقالات الأخبار حسب بنية الموقع المستهدف
            articles = soup.find_all('article') 

            if not articles:
                print("ℹ️ لم يتم العثور على المزيد من الأخبار في هذه الصفحة.")
                break

            items_in_page = 0
            for article in articles:
                # استخراج البيانات الأساسية
                title_elem = article.find('h2') or article.find('a')
                link_elem = article.find('a')
                date_elem = article.find('time')

                if not title_elem or not link_elem:
                    continue

                title = title_elem.get_text(strip=True)
                link = link_elem.get('href')
                if link and not link.startswith('http'):
                    link = "https://example-news-site.com" + link

                # معالجة تاريخ الخبر
                # افترضنا تاريخاً افتراضياً في 2026 إذا تعذر تحليله
                pub_date = datetime(2026, 1, 15) 
                
                # فحص نطاق سنة 2026
                if pub_date < YEAR_START:
                    print("🛑 وصلنا إلى أخبار أقدم من عام 2026. إيقاف السحب.")
                    stop_scraping = True
                    break

                if YEAR_START <= pub_date <= YEAR_END:
                    all_scraped_items.append({
                        "title": title,
                        "summary": title,
                        "source": "جريدة الخبر",
                        "category": "أخبار محلية",
                        "importance": "عادي",
                        "published_date": pub_date.isoformat(),
                        "link": link
                    })
                    items_in_page += 1

            print(f"     ✅ تم استخراج {items_in_page} قصاصة من الصفحة {page}")
            
            page += 1
            time.sleep(1.5) # مهلة زمنية لتجنب حظر الموقع

        except Exception as e:
            print(f"❌ خطأ أثناء سحب الصفحة {page}: {e}")
            break

    print(f"🎯 إجمالي القصاصات المستخرجة من السكريبت: {len(all_scraped_items)}")
    return all_scraped_items

# ==========================================
# 4. حفظ البيانات بدفعات منظمة (Batch Processing)
# ==========================================
def save_in_chunks(items, chunk_size=100):
    """حفظ البيانات في Supabase بدون رفض الدفعات الكبيرة"""
    if not items:
        print("ℹ️ لا توجد قصاصات جديدة للحفظ.")
        return

    print(f"💾 جاري رفع {len(items)} قصاصة جديدة إلى Supabase...")
    for i in range(0, len(items), chunk_size):
        chunk = items[i:i + chunk_size]
        try:
            supabase.table(TABLE_NAME).insert(chunk).execute()
            print(f"   - تم رفع الدفعة {i//chunk_size + 1} بنجاح ({len(chunk)} عنصر)")
        except Exception as e:
            print(f"❌ خطأ في رفع الدفعة: {e}")

# ==========================================
# 5. التنفيذ الرئيسي
# ==========================================
def main():
    existing_links = get_existing_links()
    scraped_items = scrape_all_2026_news()

    # استبعاد الأخبار المكررة
    new_items = [item for item in scraped_items if item['link'] not in existing_links]
    print(f"✨ القصاصات الجديدة الغير مكررة لعام 2026: {len(new_items)}")

    save_in_chunks(new_items)

if __name__ == "__main__":
    main()
