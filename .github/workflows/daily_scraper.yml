name: Daily News Scraper 2026

on:
  schedule:
    # يتم التشغيل تلقائياً يومياً الساعة 06:00 صباحاً بتوقيت UTC
    - cron: '0 6 * * *'
  workflow_dispatch: # يتيح لك خيار التفعيل اليدوي بنقرة زر من جيثب

jobs:
  scrape-and-update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install feedparser supabase python-dateutil requests beautifulsoup4

      - name: Locate and Run Scraper Script
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: |
          # البحث عن ملف scraper.py وتشغيله أينما كان موقعه
          SCRIPTPATH=$(find . -maxdepth 2 -name "scraper.py" -print -quit)
          if [ -n "$SCRIPTPATH" ]; then
            echo "✅ تم العثور على السكريبت في: $SCRIPTPATH"
            python "$SCRIPTPATH"
          else
            echo "❌ خطأ: لم يتم العثور على ملف scraper.py في المستودع!"
            exit 1
          fi
